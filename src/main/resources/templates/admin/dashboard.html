<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin | E-Municipalité</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stat-card { transition: transform 0.3s; border: none; border-radius: 15px; }
        .stat-card:hover { transform: translateY(-5px); }
        .icon-shape { width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }

        .main-content { background-color: #f8f9fa; min-height: 100vh; width: 100%; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row flex-nowrap">

        <div th:replace="~{admin/navbar-admin :: navbar}"></div>

        <div class="col py-3 main-content">
            <div class="container pb-5">

                <div class="row mb-4 mt-3">
                    <div class="col-12">
                        <h3 class="fw-bold">Aperçu de l'activité</h3>
                        <p class="text-muted">Statistiques en temps réel de votre municipalité.</p>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="card stat-card bg-primary text-white shadow">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-shape me-3"><i class="fas fa-file-alt fa-lg"></i></div>
                                <div>
                                    <h6 class="mb-0 opacity-75 small">Total Demandes</h6>
                                    <h2 class="mb-0 fw-bold" th:text="${stats.totalDemandes}">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card bg-warning text-dark shadow">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-shape me-3 text-dark"><i class="fas fa-clock fa-lg"></i></div>
                                <div>
                                    <h6 class="mb-0 opacity-75 small">En Attente</h6>
                                    <h2 class="mb-0 fw-bold" th:text="${stats.demandesEnAttente}">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card bg-success text-white shadow">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-shape me-3"><i class="fas fa-hand-holding-dollar fa-lg"></i></div>
                                <div>
                                    <h6 class="mb-0 opacity-75 small">Revenus (TND)</h6>
                                    <h2 class="mb-0 fw-bold" th:text="${stats.totalFraisCollectes}">0.0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 mb-4">
                        <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                            <h5 class="fw-bold mb-4"><i class="fas fa-chart-pie me-2 text-primary"></i>Demandes par Service</h5>
                            <canvas id="myChart" style="max-height: 280px;"></canvas>
                        </div>
                    </div>

                    <div class="col-lg-6 mb-4">
                        <div class="card border-0 shadow-sm p-4 h-100" style="border-radius: 15px;">
                            <h5 class="fw-bold mb-4"><i class="fas fa-history me-2 text-primary"></i>Dernières Activités</h5>
                            <div class="table-responsive">
                                <table class="table table-borderless align-middle">
                                    <thead class="text-muted small text-uppercase">
                                    <tr><th>Citoyen</th><th>Service</th><th>Statut</th></tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="d : ${lastDemandes}">
                                        <td class="fw-bold small" th:text="${d.citoyen.nom}">-</td>
                                        <td class="small" th:text="${d.service.nom}">-</td>
                                        <td>
                                            <span th:if="${d.statut.equalsIgnoreCase('En attente')}" class="badge bg-warning text-dark small">En attente</span>
                                            <span th:if="${d.statut.equalsIgnoreCase('Acceptée')}" class="badge bg-success small">Validé</span>
                                            <span th:if="${d.statut.equalsIgnoreCase('En Cours')}" class="badge bg-info small">En cours</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-center mt-3 border-top pt-2">
                                <a th:href="@{/admin/demandes/liste}" class="btn btn-link btn-sm text-decoration-none">Voir tout</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const dataMap = /*[[${stats.demandesParService}]]*/ {};
    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: Object.keys(dataMap),
            datasets: [{
                data: Object.values(dataMap),
                backgroundColor: ['#0d6efd', '#ffc107', '#198754', '#dc3545', '#adb5bd'],
                borderWidth: 2,
                borderColor: '#ffffff'
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });
</script>
</body>
</html>
