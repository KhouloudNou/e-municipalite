<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion Demandes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <div th:replace="~{admin/navbar-admin :: navbar}"></div>

        <div class="col py-3">
            <div class="container">
                <div class="card shadow-sm p-4">
                    <h3 class="fw-bold mb-4">Suivi des Demandes</h3>

                    <form th:action="@{/admin/demandes/liste}" method="get" class="mb-3 d-flex">
                        <div class="input-group w-50">
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nom du citoyen...">
                            <button class="btn btn-primary"><i class="fas fa-search"></i></button>
                        </div>
                    </form>

                    <table class="table align-middle table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>Citoyen</th><th>Service</th><th>Statut</th><th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${demandes}">
                            <td th:text="${d.citoyen.nom}" class="fw-bold"></td>
                            <td th:text="${d.service.nom}"></td>
                            <td>
                                <span th:class="${d.statut == 'En attente' ? 'badge bg-warning text-dark' : (d.statut == 'En Cours' ? 'badge bg-info' : 'bg-success badge')}"
                                      th:text="${d.statut}"></span>
                            </td>
                            <td>
                                <a th:if="${d.statut == 'En attente'}" th:href="@{/admin/demandes/traiter/{id}(id=${d.id})}" class="btn btn-sm btn-dark">Commencer</a>
                                <a th:if="${d.statut == 'En Cours'}" th:href="@{/admin/demandes/form-resultat/{id}(id=${d.id})}" class="btn btn-sm btn-primary">Finaliser</a>
                                <span th:if="${d.statut == 'Acceptée'}" class="text-success fw-bold small"><i class="fas fa-check-circle"></i> Envoyé</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <nav th:if="${pages.length > 0}">
                        <ul class="pagination mt-3">
                            <li th:each="v,s : ${pages}" class="page-item">
                                <a th:href="@{/admin/demandes/liste(page=${s.index}, keyword=${keyword})}"
                                   th:class="${currentPage == s.index ? 'page-link active' : 'page-link'}" th:text="${s.index + 1}"></a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
