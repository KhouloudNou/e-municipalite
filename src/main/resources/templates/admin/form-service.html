<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gérer Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0" th:text="${serviceMuni.id == null ? 'Nouveau Service' : 'Modifier Service'}"></h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/services/save}" th:object="${serviceMuni}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Nom du Service</label>
                        <input type="text" th:field="*{nom}" class="form-control" placeholder="Ex: Extrait de Naissance" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Frais (DT)</label>
                        <input type="number" step="0.5" th:field="*{frais}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Documents Requis</label>
                    <input type="text" th:field="*{documentsRequis}" class="form-control" placeholder="Ex: Copie CIN, Timbre fiscal...">
                    <small class="text-muted">Séparez les documents par des virgules.</small>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/services/liste}" class="btn btn-outline-secondary">Retour</a>
                    <button type="submit" class="btn btn-success px-4">Enregistrer le Service</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
