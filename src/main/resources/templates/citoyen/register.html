<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Inscription Citoyen</h4>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="@{/register}" th:object="${citoyen}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nom complet</label>
                            <input type="text" th:field="*{nom}" class="form-control" placeholder="Votre nom"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Votre email"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Votre mot de passe"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/dashboard}">Déjà un compte ? Se connecter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
