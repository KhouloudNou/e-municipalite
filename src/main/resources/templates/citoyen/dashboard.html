<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de Bord | Citoyen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; overflow-x: hidden; }
        #sidebar { min-width: 250px; max-width: 250px; min-height: 100vh; background: #212529; transition: all 0.3s; }
        .nav-link { color: #adb5bd; padding: 15px 20px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #343a40; color: #fff; border-left: 4px solid #0d6efd; }
        .kpi-card { border-radius: 15px; border: none; transition: transform 0.3s; }
        .kpi-card:hover { transform: translateY(-5px); }
        .result-card { border-left: 5px solid #1f5568; background: #f8fff9; border-radius: 10px; }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{citoyen/navbar :: sidebar}"></div>

    <div class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-bold text-primary">E-Municipalité</span>
            <div class="ms-auto d-flex align-items-center">
                <span class="me-3 text-muted small">Bienvenue,</span>
                <span class="badge bg-primary p-2">
                    <i class="fas fa-user-circle me-1"></i> <span th:text="${citoyen.nom}"></span>
                </span>
            </div>
        </nav>

        <div class="container-fluid p-4">

            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card kpi-card bg-primary text-white shadow">
                        <div class="card-body d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-uppercase small opacity-75">Services Abonnés</h6>
                                <h2 class="mb-0 fw-bold" th:text="${nbAbonnements}">0</h2>
                            </div>
                            <i class="fas fa-concierge-bell fa-3x opacity-25"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card kpi-card bg-success text-white shadow">
                        <div class="card-body d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-uppercase small opacity-75">Mes Demandes</h6>
                                <h2 class="mb-0 fw-bold" th:text="${nbDemandes}">0</h2>
                            </div>
                            <i class="fas fa-file-invoice fa-3x opacity-25"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card kpi-card bg-warning text-dark shadow">
                        <div class="card-body d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h6 class="text-uppercase small opacity-75">Docs Prêts</h6>
                                <h2 class="mb-0 fw-bold" th:text="${nbDocsPrets}">0</h2>
                            </div>
                            <i class="fas fa-download fa-3x opacity-25"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                        <div class="card-header bg-white py-3 border-0">
                            <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-bell text-warning me-2"></i>Notifications Récentes</h5>
                        </div>
                        <div class="card-body">
                            <div th:each="d : ${citoyen.demandes}" th:if="${d.resultatDemande != null}"
                                 class="alert result-card d-flex align-items-center justify-content-between shadow-sm">
                                <div>
                                    <i class="fas fa-check-circle text-success me-3 fa-lg"></i>
                                    <span>Votre document pour <strong><span th:text="${d.service.nom}"></span></strong> est prêt !</span>
                                </div>

                            </div>

                            <div th:if="${nbDocsPrets == 0}" class="text-center py-4">
                                <i class="fas fa-inbox fa-3x text-light mb-2"></i>
                                <p class="text-muted small mb-0">Aucune nouvelle notification pour le moment.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-header bg-white py-3 border-0">
                            <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-star text-primary me-2"></i>Mes Services Actifs</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Service</th>
                                        <th>Description</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="s : ${citoyen.servicesAbonnes}">
                                        <td class="fw-bold text-primary" th:text="${s.nom}"></td>
                                        <td class="text-muted small" th:text="${s.description}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3 small text-muted">Aide & Support</h6>
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-envelope text-primary me-2"></i>
                                <span class="small">contact@muni.gov.tn</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="fas fa-phone text-primary me-2"></i>
                                <span class="small">+216 71 000 000</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
