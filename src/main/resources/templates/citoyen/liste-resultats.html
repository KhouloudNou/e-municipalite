<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes Résultats | E-Muni</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }

        .sidebar-wrapper { min-width: 250px; min-height: 100vh; background: #212529; }
        .res-card { border: none; border-radius: 12px; transition: 0.3s; }
        .res-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar-wrapper">
        <div th:replace="~{citoyen/navbar :: sidebar}"></div>
    </div>

    <div class="flex-grow-1 p-5">
        <h3 class="fw-bold mb-4"><i class="fas fa-file-pdf text-danger me-2"></i>Mes Documents Prêts</h3>

        <div class="row">
            <div class="col-md-6 col-lg-4 mb-4" th:each="r : ${resultats}">
                <div class="card res-card shadow-sm p-4">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="badge bg-success-subtle text-success">Disponible</span>
                        <i class="fas fa-file-pdf fa-2x text-danger"></i>
                    </div>

                    <h5 class="fw-bold" th:text="${r.demande.service.nom}">Mariage Civil</h5>

                    <p class="text-muted small">Réf: <span th:text="${r.refrencePdf}">#123</span></p>

                    <div class="bg-light p-2 rounded mb-3 small italic">
                        <i class="fas fa-info-circle me-1"></i>
                        <span th:text="${r.commentaireAdmin}">Note...</span>
                    </div>

                    <div class="d-grid">
                        <a th:href="@{/display/{file}(file=${r.fichierPdf})}" download
                           class="btn btn-primary rounded-pill fw-bold">
                            <i class="fas fa-download me-2"></i> Télécharger
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(resultats)}">
                <p class="text-muted">Aucun document n'est encore prêt.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
