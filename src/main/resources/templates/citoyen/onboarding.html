<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Choix des Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .service-card { transition: all 0.3s; border: 2px solid #eee; cursor: pointer; }
        .service-card:hover { border-color: #0d6efd; transform: translateY(-5px); }
        .form-check-input:checked + .card { border-color: #0d6efd; background-color: #f8fbff; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="text-center mb-5">
        <i class="fas fa-city fa-3x text-primary mb-3"></i>
        <h2 class="fw-bold">Bienvenue sur votre E-Espace</h2>
        <p class="text-muted">Sélectionnez les services municipaux que vous souhaitez suivre :</p>
    </div>

    <form th:action="@{/subscribe}" method="post">
        <div class="row g-4">
            <div th:each="s : ${allServices}" class="col-md-4">
                <label class="w-100">
                    <input type="checkbox" name="serviceIds" th:value="${s.id}" class="d-none form-check-input">
                    <div class="card h-100 service-card shadow-sm">
                        <div class="card-body text-center">
                            <i class="fas fa-file-invoice text-secondary mb-3 fa-2x"></i>
                            <h5 class="card-title fw-bold" th:text="${s.nom}"></h5>
                            <p class="card-text text-muted small" th:text="${s.description}"></p>
                        </div>
                    </div>
                </label>
            </div>
        </div>
        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary btn-lg px-5 shadow">
                Finaliser mon profil <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </div>
    </form>
</div>
</body>
</html>
