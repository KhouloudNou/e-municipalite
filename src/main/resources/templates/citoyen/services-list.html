<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Explorer les Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #sidebar { min-width: 250px; max-width: 250px; min-height: 100vh; background: #212529; }
        .nav-link { color: #adb5bd; padding: 15px 20px; }
        .nav-link:hover, .nav-link.active { background: #343a40; color: #fff; }
        .service-item:hover { background: #f8f9fa; transition: 0.3s; }
        .pagination .page-link { color: #212529; }
        .pagination .page-item.active .page-link { background-color: #0d6efd; border-color: #0d6efd; color: white; }
    </style>
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{citoyen/navbar :: sidebar}"></div>

    <div class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-bold text-primary">
                <i class="fas fa-concierge-bell me-2"></i>Explorer les Services Municipaux
            </span>
        </nav>

        <div class="container-fluid p-4">

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/services}" method="get" class="row g-2">
                        <div class="col-md-9">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="fas fa-search text-muted"></i>
                                </span>
                                <input type="text" name="keyword" th:value="${keyword}"
                                       class="form-control border-start-0"
                                       placeholder="Rechercher par nom ou description...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                <i class="fas fa-filter me-2"></i>Filtrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0 text-dark">Services disponibles à l'abonnement</h5>
                        <span class="badge bg-light text-dark border" th:text="${availableServices.size() + ' services trouvés'}"></span>
                    </div>
                    <hr>

                    <div th:if="${availableServices.isEmpty()}" class="text-center py-5">
                        <i class="fas fa-info-circle fa-3x text-muted mb-3"></i>
                        <h4>Aucun service trouvé</h4>
                        <p class="text-muted" th:if="${keyword != ''}">Aucun résultat pour "<span th:text="${keyword}"></span>"</p>
                        <p class="text-muted" th:if="${keyword == ''}">Vous êtes déjà abonné à tous les services disponibles.</p>
                        <a th:href="@{/dashboard}" class="btn btn-outline-primary mt-2">Retour au Dashboard</a>
                    </div>

                    <form th:if="${!availableServices.isEmpty()}" th:action="@{/services/subscribe-more}" method="post">
                        <div class="list-group shadow-sm mb-4">
                            <div th:each="s : ${availableServices}"
                                 class="list-group-item list-group-item-action service-item py-3">
                                <div class="form-check d-flex align-items-center">
                                    <input class="form-check-input me-3" type="checkbox" name="serviceIds"
                                           th:value="${s.id}" th:id="'service' + ${s.id}"
                                           style="width: 22px; height: 22px;">
                                    <label class="form-check-label w-100" th:for="'service' + ${s.id}">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="mb-0 fw-bold text-dark" th:text="${s.nom}"></h6>
                                                <small class="text-muted" th:text="${s.description}"></small>
                                            </div>
                                            <div class="text-end">
                                                <span class="text-primary fw-bold" th:text="${s.frais + ' DT'}"></span>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <nav th:if="${totalPages > 1}">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/services(page=${currentPage - 1}, keyword=${keyword})}">
                                        <i class="fas fa-chevron-left"></i>
                                    </a>
                                </li>

                                <li class="page-item" th:each="p, status : ${pages}"
                                    th:classappend="${status.index == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/services(page=${status.index}, keyword=${keyword})}"
                                       th:text="${status.index + 1}"></a>
                                </li>

                                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/services(page=${currentPage + 1}, keyword=${keyword})}">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>

                        <div class="mt-4 text-end border-top pt-3">
                            <a th:href="@{/dashboard}" class="btn btn-light me-2">Annuler</a>
                            <button type="submit" class="btn btn-primary px-5 shadow">
                                <i class="fas fa-plus-circle me-2"></i>S'abonner aux services sélectionnés
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
